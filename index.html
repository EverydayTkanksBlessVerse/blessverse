<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>말씀 저장소</title>

<!-- ✅ SUIT 폰트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/static/woff2/SUIT.css">

<style>
  body {
    margin: 0;
    font-family: 'SUIT', sans-serif;
    background: linear-gradient(to bottom, #ffd6e8, #cfe7ff);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #app {
    flex: 1;
    padding: 20px;
    text-align: center;
  }

  .verse-box {
    background: white;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0px 8px 20px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    white-space: pre-line;
    font-size: 18px;
    line-height: 1.5;
  }

  button {
    width: 80%;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    font-weight: 500;
  }

  #randomBtn {
    background: #ff8fab;
    color: white;
  }

  #saveBtn {
    background: white;
    border: 2px solid #ddd;
  }

  /* ✅ 하단 네비게이션  */
  nav {
    display: flex;
    border-top: 1px solid #ddd;
    background: white;
  }
  nav div {
    flex: 1;
    padding: 10px 0;
    text-align: center;
    font-size: 14px;
    cursor: pointer;
  }

  nav div.active {
    color: #ff5d8f;
    font-weight: 600;
  }
</style>

</head>
<body>

<div id="app">
  <div id="todayPage">
    <div id="verseBox" class="verse-box">말씀을 불러오고 있어요...</div>
    <button id="randomBtn">랜덤 말씀 보기</button>
    <button id="saveBtn">내 말씀 저장</button>
  </div>

  <div id="savedPage" style="display:none;">
    <h3>내가 저장한 말씀</h3>
    <div id="savedList" style="margin-top:20px; text-align:left;"></div>
  </div>

  <div id="sharePage" style="display:none;">
    <h3>공유 링크</h3>
    <input id="shareLink" style="width:90%; padding:10px; border-radius:8px; border:1px solid #ccc;" readonly>
  </div>
</div>

<!-- ✅ 하단 네비 -->
<nav>
  <div id="navToday" class="active">오늘</div>
  <div id="navSaved">저장함</div>
  <div id="navShare">공유</div>
</nav>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";

const verseBox = document.getElementById("verseBox");
const shareLink = document.getElementById("shareLink");
let currentVerse = null;

async function getRandomVerse() {
  verseBox.textContent = "말씀 불러오는 중...";
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    currentVerse = data;
    verseBox.textContent = `${data.verse}\n\n- ${data.reference}`;

    // ✅ 이미지 표시
    const img = document.getElementById("verseImg");
    if (data.image && data.image !== "") {
      img.src = data.image;
      img.style.display = "block";
    } else {
      img.style.display = "none";
    }

  } catch {
    verseBox.textContent = "오류가 발생했어요 😭";
  }
}


document.getElementById("randomBtn").addEventListener("click", getRandomVerse);

document.getElementById("saveBtn").addEventListener("click", () => {
  if (!currentVerse) return alert("말씀이 아직 불러와지지 않았어요!");

  const saved = JSON.parse(localStorage.getItem("savedVerses") || "[]");
  saved.push(currentVerse);
  localStorage.setItem("savedVerses", JSON.stringify(saved));
  alert("✅ 저장되었습니다!");
});

function showSaved() {
  const list = JSON.parse(localStorage.getItem("savedVerses") || "[]");
  const container = document.getElementById("savedList");

  if (list.length === 0) {
    container.innerHTML = "<p style='text-align:center;'>아직 저장된 말씀이 없습니다 🙏</p>";
    return;
  }

  container.innerHTML = list.map(v =>
    `<div style="padding:12px; background:white; margin-bottom:10px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">
      ${v.verse}<br><br><strong>- ${v.reference}</strong>
    </div>`
  ).join("");
}

document.getElementById("navToday").onclick = () => switchPage("today");
document.getElementById("navSaved").onclick = () => {
  switchPage("saved");
  showSaved();
};
document.getElementById("navShare").onclick = () => {
  switchPage("share");
  shareLink.value = window.location.href;
};

function switchPage(page) {
  document.getElementById("todayPage").style.display = page==="today" ? "block" : "none";
  document.getElementById("savedPage").style.display = page==="saved" ? "block" : "none";
  document.getElementById("sharePage").style.display = page==="share" ? "block" : "none";

  document.querySelectorAll("nav div").forEach(n => n.classList.remove("active"));
  document.getElementById("nav" + page.charAt(0).toUpperCase() + page.slice(1)).classList.add("active");
}

getRandomVerse();
</script>
</body>
</html>
