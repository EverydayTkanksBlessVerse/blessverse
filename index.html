<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BlessVerse</title>

  <!-- 캐시 무력화 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    :root{
      --bg1:#0e2a32; --bg2:#224c5d; --card:rgba(255,255,255,.08);
      --text:#e9f3f6; --muted:#bcd0d6; --btn:#79c2ff; --btnTxt:#0c1a22;
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0; color:var(--text); font-family:system-ui,Apple SD Gothic Neo,Segoe UI,Arial;
      background:linear-gradient(var(--bg1),var(--bg2)) fixed; min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
    }
    h1{margin:28px 0 14px; font-size:44px}
    .nav{display:flex; gap:10px; margin:8px 0 24px;}
    .tab{
      background:var(--card); border:1px solid rgba(255,255,255,.15);
      color:var(--text); padding:10px 16px; border-radius:12px; cursor:pointer;
    }
    .tab.active{background:var(--btn); color:var(--btnTxt); font-weight:700}
    .container{width:min(960px,92%);}
    .card{
      background:var(--card); border-radius:14px; padding:16px 18px;
      box-shadow:0 8px 26px rgba(0,0,0,.25); margin:12px 0;
      border:1px solid rgba(255,255,255,.08);
    }
    .muted{color:var(--muted)}
    .btn{background:var(--btn); color:var(--btnTxt); border:0; cursor:pointer;
      border-radius:12px; padding:10px 16px; font-weight:700; margin:6px 6px 6px 0;}
    .btn.secondary{background:var(--card); color:var(--text); border:1px solid rgba(255,255,255,.18)}
    .btn.danger{background:var(--danger); color:#fff}
    img#img{width:100%; border-radius:12px; display:none; margin-top:10px}
    .hidden{display:none}
    ul#savedList{padding-left:22px; line-height:1.8; margin:8px 0 0}
    .saved-row{display:flex; align-items:center; justify-content:space-between; gap:10px}
    .btnX{background:transparent; border:1px solid rgba(255,255,255,.25);
      color:#fff; padding:2px 8px; border-radius:8px; cursor:pointer; font-size:12px;}
    .btnX:hover{background:rgba(255,255,255,.12)}
    input[type=url]{width:100%; padding:10px 12px; border-radius:10px;
      border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.2); color:#fff}
    .mt8{margin-top:8px} .mt12{margin-top:12px}
  </style>
</head>
<body>
  <h1>오늘의 말씀</h1>

  <!-- 상단 네비 탭 -->
  <div class="nav" id="nav">
    <button class="tab active" data-page="today">오늘의 말씀</button>
    <button class="tab" data-page="saved">저장함</button>
    <button class="tab" data-page="share">공유하기</button>
  </div>

  <div class="container">
    <!-- PAGE: 오늘의 말씀 -->
    <section id="page-today">
      <div class="card">
        <div id="verse" class="muted">로딩 중…</div>
        <div id="ref" class="muted">-</div>
        <img id="img" alt="verse image"/>
        <div class="mt12">
          <button class="btn" id="btn-random">랜덤 말씀 보기</button>
          <button class="btn secondary" id="btn-save">내 말씀 저장</button>
        </div>
      </div>
    </section>

    <!-- PAGE: 저장함 -->
    <section id="page-saved" class="hidden">
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px">
          <b>내가 저장한 말씀</b>
          <div class="row-actions">
            <button class="btn secondary" id="btn-export">내보내기(.txt)</button>
            <button class="btn danger" id="btn-clear">전체 삭제</button>
          </div>
        </div>
        <ul id="savedList"></ul>
        <div id="emptySaved" class="muted mt8">아직 저장된 말씀이 없습니다.</div>
      </div>
    </section>

    <!-- PAGE: 공유하기 -->
    <section id="page-share" class="hidden">
      <div class="card">
        <b>현재 말씀 공유</b>
        <div class="mt8 muted">아래 링크를 보내면 상대방이 동일한 구절을 보게 됩니다.</div>
        <input id="shareLink" type="url" class="mt8" readonly />
        <div class="mt12">
          <button class="btn" id="btn-copy">링크 복사</button>
          <button class="btn secondary" id="btn-native-share">기기 공유 시트 열기</button>
        </div>
      </div>
      <div class="card">
        <b>설명</b>
        <div class="mt8 muted">※ 저장함에서 각 항목 우측 <b>X</b> 버튼으로 개별 삭제 가능.</div>
      </div>
    </section>
  </div>

<script>
/* =====================[ 1) 설정 ]===================== */
/* Apps Script 웹앱 /exec 주소로 바꾸세요 */
const API_URL = "https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";

/* 사이트 루트 (링크 생성용) */
const SITE_URL = location.origin + location.pathname.replace(/index\.html$/,'');

/* =====================[ 2) 유틸 ]===================== */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function formatTs(ms){
  const d = new Date(ms);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
/* 시트 헤더 오타/공백 안전하게 읽기 */
function readKey(o,k){
  if(!o) return "";
  const keys = Object.keys(o);
  const target = keys.find(kk => kk.trim().toLowerCase() === k.trim().toLowerCase());
  return target ? o[target] : "";
}

/* =====================[ 3) 라우팅 ]===================== */
const pages = { today:$("page-today"), saved:$("page-saved"), share:$("page-share") };
function navigate(page){
  Object.keys(pages).forEach(p=>{
    pages[p].classList.toggle("hidden", p!==page);
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active", t.dataset.page===page));
  });
  if(page==="saved") renderSaved();
  if(page==="share") refreshShareLink();
}
$("nav").addEventListener("click", e=>{
  if(e.target.classList.contains("tab")){
    navigate(e.target.dataset.page);
    history.replaceState(null,"","#"+e.target.dataset.page);
  }
});

/* =====================[ 4) 말씀 불러오기 ]===================== */
async function loadVerse(){
  try{
    $("verse").textContent = "말씀을 불러오는 중...";
    $("ref").textContent = "-";
    $("img").style.display = "none";

    const u = new URL(API_URL);
    const q = new URLSearchParams(location.search); // ?id=전달
    q.forEach((v,k)=>u.searchParams.set(k,v));
    u.searchParams.set("_t", Date.now()); // 캐시 우회

    // 5초 타임아웃
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 5000);
    const res = await fetch(u, {signal:controller.signal, cache:"no-store"});
    clearTimeout(timer);

    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const v = data?.verse || {};

    const verse = readKey(v, "Verse");
    const ref   = readKey(v, "Reference");
    const img   = readKey(v, "ImageURL");
    const id    = readKey(v, "ID");

    $("verse").textContent = verse || "말씀이 없습니다.";
    $("ref").textContent   = ref   || "-";
    if(img){ $("img").src = img; $("img").style.display = "block"; }
    refreshShareLink(id);

  }catch(e){
    console.warn("1차 실패:", e.message);
    $("verse").textContent = "불러오기 실패… 재시도 중";
    await sleep(1200);
    try{
      const res2 = await fetch(API_URL+"?_t="+Date.now(), {cache:"no-store"});
      const data2 = await res2.json();
      const v = data2?.verse || {};
      $("verse").textContent = readKey(v,"Verse") || "말씀이 없습니다.";
      $("ref").textContent   = readKey(v,"Reference") || "-";
      const img = readKey(v,"ImageURL");
      if(img){ $("img").src = img; $("img").style.display = "block"; }
      refreshShareLink(readKey(v,"ID"));
    }catch{
      $("verse").textContent = "불러오기 실패(네트워크/서버).";
      $("ref").textContent = "-";
    }
  }
}

/* =====================[ 5) 저장/삭제/목록 ]===================== */
const KEY = "bless_saved_v1"; // (구조 변경 시 키도 같이 바꿔 충돌 방지)
function getSaved(){ try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return[]} }
function setSaved(list){ localStorage.setItem(KEY, JSON.stringify(list.slice(0,200))); }

function saveVerse(){
  const verse = $("verse").textContent.trim();
  const ref   = $("ref").textContent.trim();
  if(!verse || verse === "말씀을 불러오는 중..." || verse.startsWith("불러오기 실패")) {
    alert("말씀을 먼저 불러온 뒤 저장해 주세요.");
    return;
  }
  const item = { verse, ref, ts: Date.now() };
  const list = getSaved();

  // 동일 텍스트/레퍼런스 중복 방지
  if(!list.some(x=>x.verse===item.verse && x.ref===item.ref)){
    list.unshift(item);
    setSaved(list);
    alert("저장되었습니다.");
  }else{
    alert("이미 저장된 말씀입니다.");
  }
  renderSaved();
}

function deleteSaved(idx){
  const list = getSaved();
  list.splice(idx,1);
  setSaved(list);
  renderSaved();
}
function clearSaved(){
  if(confirm("저장한 말씀을 모두 삭제할까요?")){
    setSaved([]);
    renderSaved();
  }
}
function exportSaved(){
  const list = getSaved();
  if(!list.length){ alert("내보낼 항목이 없습니다."); return; }
  const lines = list.map(x=>`- ${x.verse} (${x.ref}) · ${formatTs(x.ts||Date.now())}`);
  const blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "blessverse_saved.txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

function renderSaved(){
  const l = getSaved();
  const ul = $("savedList");
  ul.innerHTML = "";
  $("emptySaved").style.display = l.length ? "none" : "block";

  l.forEach((x, idx) => {
    const li = document.createElement("li");
    const date = x.ts ? formatTs(x.ts) : "";
    li.innerHTML = `
      <div class="saved-row">
        <span>- ${x.verse} (${x.ref}) <span style="opacity:.6;font-size:13px;"> · ${date}</span></span>
        <button class="btnX" onclick="deleteSaved(${idx})">X</button>
      </div>
    `;
    ul.appendChild(li);
  });
}

/* =====================[ 6) 공유 ]===================== */
function buildShareURL(id){
  const url = new URL(SITE_URL, location.href);
  if(id) url.searchParams.set("id", id);
  return url.toString();
}
function refreshShareLink(idFromAPI){
  const currentId = idFromAPI || new URLSearchParams(location.search).get("id");
  $("shareLink").value = buildShareURL(currentId);
}
async function copyShare(){
  try{
    await navigator.clipboard.writeText($("shareLink").value);
    alert("링크가 복사되었습니다.");
  }catch{
    $("shareLink").select(); document.execCommand("copy");
    alert("링크가 복사되었습니다.(호환 모드)");
  }
}
async function nativeShare(){
  const shareData = {
    title: "오늘의 말씀",
    text: `${$("verse").textContent} — ${$("ref").textContent}`,
    url: $("shareLink").value
  };
  if(navigator.share){
    try{ await navigator.share(shareData); }
    catch(e){ if(e.name!=="AbortError") alert("공유 실패: "+e.message); }
  }else{
    copyShare();
  }
}

/* =====================[ 7) 이벤트 & 초기화 ]===================== */
$("btn-random").onclick = loadVerse;
$("btn-save").onclick   = saveVerse;
$("btn-clear").onclick  = clearSaved;
$("btn-export").onclick = exportSaved;
$("btn-copy").onclick   = copyShare;
$("btn-native-share").onclick = nativeShare;

// 해시 라우팅
const hash = (location.hash||"").replace("#","");
if(["saved","share"].includes(hash)) navigate(hash); else navigate("today");

renderSaved();
loadVerse();
</script>
</body>
</html>
