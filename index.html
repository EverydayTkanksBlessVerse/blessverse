<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>오늘의 말씀</title>
  <style>
    :root{
      --pink:#ffc2d4;
      --blue:#d6e6ff;
      --primary:#ff8faa;
      --ink:#111;
      --muted:#666;
      --card-bg:#fff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Pretendard, Apple SD Gothic Neo, Noto Sans KR, "Malgun Gothic", sans-serif;
      background: linear-gradient(to bottom,var(--pink),var(--blue));
      min-height:100vh;
      color:var(--ink);
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    h1{margin:24px 0 6px; font-size:28px; font-weight:800;}
    .date{font-size:13px;color:var(--muted); margin-bottom:10px;}

    /* ✅ 사용법 카드 */
    .usage-card{
      width:min(92vw,640px);
      background:var(--card-bg);
      border-radius:16px;
      box-shadow:0 6px 18px rgba(0,0,0,.12);
      padding:18px 18px;
      margin-top:6px;
      font-size:14px;
      line-height:1.6;
      display:none;
    }
    .usage-toggle{
      font-size:14px;
      color:#333;
      text-decoration:underline;
      cursor:pointer;
      margin-top:6px;
    }

    .card{
      width:min(92vw,640px);
      background:var(--card-bg);
      border-radius:16px;
      box-shadow:0 8px 28px rgba(0,0,0,.12);
      padding:22px 22px 16px;
      margin:14px auto 20px;
      text-align:center;
    }
    .imgwrap{
      width:100%;
      border-radius:12px;
      overflow:hidden;
      margin-bottom:14px;
      display:none;
    }
    .imgwrap img{width:100%; height:auto; display:block;}

    .verse{white-space:pre-wrap; line-height:1.65; font-size:18px; font-weight:600;}
    .ref{margin-top:8px;font-size:14px;color:#444;font-weight:700;}
    .tag{margin-top:4px;font-size:12px;color:#888;}

    .actions{display:flex; gap:8px; justify-content:center; margin:6px 0 10px;}
    button{
      border:none; outline:none; cursor:pointer;
      padding:12px 16px; border-radius:10px; font-weight:700;
      background:var(--primary); color:#fff; min-width:140px;
      box-shadow:0 6px 16px rgba(255,143,170,.35);
    }
    .light{background:#fff;color:#111;border:1px solid #eee; box-shadow:none}

    .dock{
      position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
      display:flex; gap:10px; background:rgba(255,255,255,.85);
      border:1px solid #eee; backdrop-filter: blur(6px);
      border-radius:18px; padding:8px 12px; box-shadow:0 8px 22px rgba(0,0,0,.12);
    }
    .dock button{min-width:90px; padding:10px 14px; border-radius:12px}

    .modal{
      position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.35);
      padding:20px;
    }
    .modal.on{display:grid}
    .sheet{
      width:min(92vw,680px); max-height:80vh; overflow:auto;
      background:#fff; border-radius:14px; padding:16px;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
      text-align:left;
    }
    .sheet .item{
      border:1px solid #eee; border-radius:10px; padding:12px; margin:10px 0;
    }
  </style>
</head>
<body>

  <h1>✝️ 오늘의 말씀</h1>
  <div class="date" id="todayStr"></div>

  <div class="usage-toggle" onclick="toggleUsage()">📖 오늘의 말씀 사용법 ▾</div>
  <div class="usage-card" id="usageCard">
    1) ‘오늘의 말씀’ 버튼을 눌러 하루의 말씀을 확인하세요.<br>
    2) 마음에 와닿는 말씀은 ‘저장하기’ 버튼으로 보관하세요.<br>
    3) 저장된 말씀은 ‘저장함’에서 언제든 다시 볼 수 있습니다.<br>
    4) 기도하며 묵상하고, 필요한 이에게 말씀을 나누어보세요. 🕊
  </div>

  <div class="card" id="card">
    <div class="imgwrap" id="imgwrap"><img id="img"/></div>
    <div class="verse" id="verseText">버튼을 눌러 말씀을 불러오세요.</div>
    <div class="ref" id="reference"></div>
    <div class="tag" id="tag"></div>

    <div class="actions">
      <button id="randomBtn">랜덤 말씀 보기</button>
      <button class="light" id="saveBtn">저장하기</button>
    </div>
  </div>

  <div class="dock">
    <button class="light" id="todayBtn">오늘</button>
    <button class="light" id="savedBtn">저장함</button>
    <button id="shareBtn">공유</button>
  </div>

<script>
function toggleUsage(){
  const box = document.getElementById("usageCard");
  box.style.display = box.style.display === "block" ? "none" : "block";
}
</script>


<script>
/* 여기 아래는 네 코드 그대로 유지 (수정 X) */
</script>

</body>
</html>
