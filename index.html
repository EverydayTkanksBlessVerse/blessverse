<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BlessVerse</title>
  <!-- 캐시 무력화(새 코드 바로 반영) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    :root{
      --bg1:#0e2a32; --bg2:#224c5d; --card:rgba(255,255,255,.08);
      --text:#e9f3f6; --muted:#bcd0d6; --btn:#79c2ff; --btnTxt:#0c1a22;
      --danger:#ff6b6b;
    }
    *{box-sizing:border-box}
    body{
      margin:0; color:var(--text); font-family:system-ui,Apple SD Gothic Neo,Segoe UI,Arial;
      background:linear-gradient(var(--bg1),var(--bg2)) fixed; min-height:100vh;
      display:flex; flex-direction:column; align-items:center;
    }
    h1{margin:28px 0 14px; font-size:44px}
    .nav{
      display:flex; gap:10px; margin:8px 0 24px;
    }
    .tab{
      background:var(--card); border:1px solid rgba(255,255,255,.15);
      color:var(--text); padding:10px 16px; border-radius:12px; cursor:pointer;
    }
    .tab.active{background:var(--btn); color:var(--btnTxt); font-weight:700}
    .container{width:min(960px,92%);}

    .card{
      background:var(--card); border-radius:14px; padding:16px 18px;
      box-shadow:0 8px 26px rgba(0,0,0,.25); margin:12px 0;
      border:1px solid rgba(255,255,255,.08);
    }
    .muted{color:var(--muted)}
    .btn{
      background:var(--btn); color:var(--btnTxt); border:0; cursor:pointer;
      border-radius:12px; padding:10px 16px; font-weight:700; margin:6px 6px 6px 0;
    }
    .btn.secondary{background:var(--card); color:var(--text); border:1px solid rgba(255,255,255,.18)}
    .btn.danger{background:var(--danger); color:#fff}
    img#img{width:100%; border-radius:12px; display:none; margin-top:10px}

    ul#savedList{padding-left:22px; line-height:1.8; margin:8px 0 0}
    .saved-row{display:flex; align-items:center; gap:10px}
    .btnX{
      background:transparent; border:1px solid rgba(255,255,255,.25);
      color:#fff; padding:2px 8px; border-radius:8px; cursor:pointer; font-size:12px;
    }
    .btnX:hover{background:rgba(255,255,255,.12)}
    .row-actions{display:flex; gap:6px}

    .hidden{display:none}
    input[type=text], input[type=url]{width:100%; padding:10px 12px; border-radius:10px;
      border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.2); color:#fff}
    .mt8{margin-top:8px} .mt12{margin-top:12px}
  </style>
</head>
<body>
  <h1>오늘의 말씀</h1>

  <!-- 상단 네비 탭 -->
  <div class="nav" id="nav">
    <button class="tab active" data-page="today">오늘의 말씀</button>
    <button class="tab" data-page="saved">저장함</button>
    <button class="tab" data-page="share">공유하기</button>
  </div>

  <div class="container">
    <!-- PAGE: 오늘의 말씀 -->
    <section id="page-today">
      <div class="card">
        <div id="verse" class="muted">로딩 중…</div>
        <div id="ref" class="muted">-</div>
        <img id="img" alt="verse image"/>
        <div class="mt12">
          <button class="btn" id="btn-random">랜덤 말씀 보기</button>
          <button class="btn secondary" id="btn-save">내 말씀 저장</button>
        </div>
      </div>
    </section>

    <!-- PAGE: 저장함 -->
    <section id="page-saved" class="hidden">
      <div class="card">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:10px">
          <b>내가 저장한 말씀</b>
          <div class="row-actions">
            <button class="btn secondary" id="btn-export">내보내기(.txt)</button>
            <button class="btn danger" id="btn-clear">전체 삭제</button>
          </div>
        </div>
        <ul id="savedList"></ul>
        <div id="emptySaved" class="muted mt8">아직 저장된 말씀이 없습니다.</div>
      </div>
    </section>

    <!-- PAGE: 공유하기 -->
    <section id="page-share" class="hidden">
      <div class="card">
        <b>현재 말씀 공유</b>
        <div class="mt8 muted">아래 링크를 보내면 상대방이 동일한 구절을 보게 됩니다.</div>
        <input id="shareLink" type="url" class="mt8" readonly />
        <div class="mt12">
          <button class="btn" id="btn-copy">링크 복사</button>
          <button class="btn secondary" id="btn-native-share">기기 공유 시트 열기</button>
        </div>
      </div>
      <div class="card">
        <b>설명</b>
        <div class="mt8 muted">※ 저장함에서 각 항목 우측 <b>X</b> 버튼으로 개별 삭제가 가능합니다.</div>
      </div>
    </section>
  </div>

<script>
  /* ====== 1) 설정값 ====== */
  // ⛳️ Apps Script 웹앱( /exec ) 주소로 교체하세요.
  const API_URL = "https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";
  // 본인 사이트 루트 (뒤 슬래시 포함 유지). 예: "https://everydaytkanksblessverse.github.io/blessverse/"
  const SITE_URL = location.origin + location.pathname.replace(/index\.html$/,'');

  /* ====== 2) 도우미 ====== */
  const $ = (id)=>document.getElementById(id);
  const readKey = (o,k)=> o?.[k] ?? o?.[k+" "] ?? o?.[k?.trim?.()] ?? "";
  const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));

  /* ====== 3) 페이지 라우팅 ====== */
  const pages = {
    today: $("page-today"),
    saved: $("page-saved"),
    share: $("page-share"),
  };
  function navigate(page){
    Object.keys(pages).forEach(p=>{
      pages[p].classList.toggle("hidden", p!==page);
      // 탭 표시
      [...document.querySelectorAll(".tab")].forEach(t=>{
        t.classList.toggle("active", t.dataset.page===page);
      });
    });
    if(page==="saved") renderSaved();
    if(page==="share") refreshShareLink();
  }
  document.getElementById("nav").addEventListener("click", (e)=>{
    if(e.target.classList.contains("tab")){
      navigate(e.target.dataset.page);
      // URL 해시로 섹션 기억(선택)
      history.replaceState(null, "", "#"+e.target.dataset.page);
    }
  });

  /* ====== 4) 말씀 불러오기 (타임아웃+1회 재시도) ====== */
  async function loadVerse(){
    try{
      $("verse").textContent = "말씀을 불러오는 중...";
      $("ref").textContent = "-";
      $("img").style.display = "none";

      const controller = new AbortController();
      const timeout = setTimeout(()=>controller.abort(), 5000);
      // 주소창의 ?id 등 파라미터를 API에 그대로 전달
      const u = new URL(API_URL);
      const q = new URLSearchParams(location.search);
      for(const [k,v] of q.entries()) u.searchParams.set(k,v);
      // 캐시 우회
      u.searchParams.set("_t", Date.now());

      const res = await fetch(u.toString(), {cache:"no-store", signal:controller.signal});
      clearTimeout(timeout);
      if(!res.ok) throw new Error("HTTP "+res.status);

      const data = await res.json();
      const v = data?.verse || {};
      const verse = readKey(v,"Verse");
      const ref   = readKey(v,"Reference");
      const img   = readKey(v,"ImageURL");

      $("verse").textContent = verse || "말씀이 없습니다.";
      $("ref").textContent   = ref || "-";
      if(img){ $("img").src = img; $("img").style.display = "block"; }
      // 공유 탭 링크 자동 갱신
      refreshShareLink(v?.ID);

    }catch(err){
      console.warn("불러오기 실패:", err.message, "1.5초 뒤 재시도");
      $("verse").textContent = "불러오기 실패… 재시도 중";
      await sleep(1500);
      // 1회 재시도
      try{
        const res = await fetch(API_URL + "?_t=" + Date.now(), {cache:"no-store"});
        const data = await res.json();
        const v = data?.verse || {};
        $("verse").textContent = readKey(v,"Verse") || "말씀이 없습니다.";
        $("ref").textContent   = readKey(v,"Reference") || "-";
        const img = readKey(v,"ImageURL");
        if(img){ $("img").src = img; $("img").style.display = "block"; }
        refreshShareLink(v?.ID);
      }catch(e){
        $("verse").textContent = "불러오기 실패(네트워크/서버).";
      }
    }
  }

  /* ====== 5) 저장/삭제/목록 ====== */
  const KEY = "my_verses";
  function getSaved(){ try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{ return [] } }
  function setSaved(list){ localStorage.setItem(KEY, JSON.stringify(list.slice(0,200))) }

  function saveVerse(){
    const id = new URLSearchParams(location.search).get("id") || null;
    const item = {
      id, verse:$("verse").textContent, ref:$("ref").textContent,
      ts: Date.now()
    };
    const list = getSaved();
    // 중복 방지(같은 텍스트/레퍼런스)
    if(!list.some(x=>x.verse===item.verse && x.ref===item.ref)){
      list.unshift(item);
      setSaved(list);
      alert("저장되었습니다.");
    }else{
      alert("이미 저장된 말씀입니다.");
    }
  }
  function deleteSaved(idx){
    const list = getSaved();
    list.splice(idx,1);
    setSaved(list);
    renderSaved();
  }
  function clearSaved(){
    if(confirm("저장한 말씀을 모두 삭제할까요?")){ setSaved([]); renderSaved(); }
  }
  function exportSaved(){
    const list = getSaved();
    if(!list.length){ alert("내보낼 항목이 없습니다."); return; }
    const lines = list.map(x=>`- ${x.verse} (${x.ref})`);
    const blob = new Blob([lines.join("\n")], {type:"text/plain;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "blessverse_saved.txt";
    a.click();
    URL.revokeObjectURL(a.href);
  }
  function renderSaved(){
    const list = getSaved();
    const ul = $("savedList");
    ul.innerHTML = "";
    $("emptySaved").style.display = list.length ? "none":"block";
    list.forEach((x,idx)=>{
      const li = document.createElement("li");
      const line = document.createElement("div");
      line.className = "saved-row";
      const text = document.createElement("div");
      text.textContent = `- ${x.verse} (${x.ref})`;
      const xbtn = document.createElement("button");
      xbtn.className = "btnX";
      xbtn.textContent = "X";
      xbtn.title = "삭제";
      xbtn.onclick = ()=>deleteSaved(idx);
      line.appendChild(text);
      line.appendChild(xbtn);
      li.appendChild(line);
      ul.appendChild(li);
    });
  }

  /* ====== 6) 공유 탭 ====== */
  function buildShareURL(id){
    // id가 있으면 ?id= 로 고정 링크 생성. 없으면 현재 페이지 기준.
    const url = new URL(SITE_URL, location.href);
    if(id) url.searchParams.set("id", id);
    return url.toString();
  }
  function refreshShareLink(idFromAPI){
    const currentId = idFromAPI || new URLSearchParams(location.search).get("id");
    $("shareLink").value = buildShareURL(currentId);
  }
  async function copyShare(){
    try{
      await navigator.clipboard.writeText($("shareLink").value);
      alert("링크가 복사되었습니다.");
    }catch{
      // input 선택 후 수동 복사 fallback
      $("shareLink").select(); document.execCommand("copy");
      alert("링크가 복사되었습니다.(호환 모드)");
    }
  }
  async function nativeShare(){
    const title = "오늘의 말씀";
    const text  = `${$("verse").textContent} — ${$("ref").textContent}`;
    const url   = $("shareLink").value;
    if(navigator.share){
      try{ await navigator.share({title, text, url}); }
      catch(e){ if(e.name!=="AbortError") alert("공유 실패: "+e.message); }
    }else{
      copyShare();
    }
  }

  /* ====== 7) 이벤트 바인딩 & 초기화 ====== */
  $("btn-random").onclick = ()=>loadVerse();
  $("btn-save").onclick   = ()=>saveVerse();

  $("btn-clear").onclick  = ()=>clearSaved();
  $("btn-export").onclick = ()=>exportSaved();

  $("btn-copy").onclick   = ()=>copyShare();
  $("btn-native-share").onclick = ()=>nativeShare();

  // 해시로 진입 시 해당 탭 오픈
  const hash = (location.hash||"").replace("#","");
  if(["saved","share"].includes(hash)) navigate(hash); else navigate("today");

  renderSaved();  // 저장함 미리 그림
  loadVerse();    // 첫 구절 로드
</script>
</body>
</html>
