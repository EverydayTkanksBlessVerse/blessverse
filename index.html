<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>BlessVerse</title>
<style>
    body {
        margin: 0;
        font-family: "Pretendard", sans-serif;
        background: linear-gradient(180deg, #f7d8e9, #cde5f9, #f7d8e9);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }
    .card {
        margin: auto;
        width: 300px;
        padding: 25px;
        border-radius: 12px;
        background: white;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        text-align: center;
        animation: fadeIn .5s ease-in-out;
    }
    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }
    .verse { font-size: 18px; margin-top: 15px; font-weight: 600; }
    .reference { margin-top: 8px; font-size: 14px; color: #666; }
    .meditation { margin-top: 12px; font-size: 13px; color: #444; }
    .btn {
        margin-top: 16px;
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: #ff88aa;
        color: white;
        cursor: pointer;
        font-size: 15px;
        width: 100%;
    }
    .navbar {
        padding: 12px;
        text-align: center;
        background: rgba(255,255,255,0.6);
        display: flex;
        justify-content: space-around;
        position: fixed;
        bottom: 0; width: 100%;
        backdrop-filter: blur(10px);
    }
    .nav-item { cursor: pointer; font-weight: 600; }
</style>
</head>
<body>

<div id="card" class="card">
    <div class="verse">불러오는 중...</div>
    <div class="reference"></div>
    <div class="meditation"></div>
</div>

<div class="navbar">
    <div class="nav-item" onclick="loadRandom()">오늘</div>
    <div class="nav-item" onclick="saveVerse()">저장함</div>
    <div class="nav-item" onclick="shareVerse()">공유</div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";

async function loadRandom() {
    try {
        const res = await fetch(API_URL);
        const { ok, verse } = await res.json();

        if (!ok) return;

        document.querySelector(".verse").innerText = verse.Verse;
        document.querySelector(".reference").innerText = verse.Reference;
        document.querySelector(".meditation").innerText = verse.Meditation;
    } catch (e) {
        document.querySelector(".verse").innerText = "오류 발생 😢 다시 시도해주세요.";
    }
}

function saveVerse() {
    alert("저장 기능은 곧 업데이트 됩니다 😊");
}

function shareVerse() {
    navigator.clipboard.writeText(window.location.href);
    alert("링크가 복사되었습니다 🔗");
}

loadRandom();
</script>

</body>
</html>
