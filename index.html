<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>오늘의 말씀</title>

<!-- 폰트 -->
<link href="https://fonts.googleapis.com/css2?family=SUIT:wght@300;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/earlyaccess/maruburi.css" rel="stylesheet">

<style>
:root{
  --bg:#0E2431;
  --card:rgba(255,255,255,.08);
  --text:#EAF4F6;
  --muted:#BFD1D5;
  --pill:#ffffff;
  --pill-text:#0E2431;
  --accent:#7BC6FF;
}
*{box-sizing:border-box; font-family:"SUIT",sans-serif;}
body{margin:0; background:var(--bg); color:var(--text); text-align:center; padding:0;}

/* PAGE WRAPPER */
.page{display:none; padding:32px 20px;}
.page.active{display:block;}

/* HOME TITLE */
.home-title{font-size:32px; margin-top:30px; font-family:"MaruBuri", serif;}
.home-sub{font-size:15px; opacity:.8; margin-bottom:30px;}

/* PILL BUTTONS */
.menu{
  display:flex;
  flex-direction:column;
  gap:16px;
  margin-top:20px;
}
.pill{
  background:var(--pill);
  color:var(--pill-text);
  font-weight:600;
  padding:14px 18px;
  border-radius:999px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  cursor:pointer;
  font-size:17px;
}

/* USAGE TOGGLE */
#usage-box{margin-top:20px; cursor:pointer; font-size:15px; color:var(--muted);}
#usage-content{display:none; margin-top:12px; line-height:1.7;}

/* CARD (오늘의말씀 / 저장함 공통) */
.card{
  background:var(--card);
  padding:20px;
  border-radius:14px;
  margin-top:20px;
  text-align:left;
}

/* 이미지 */
#img{width:100%; border-radius:12px; margin-top:12px; display:none;}

/* 버튼 */
.btn{
  background:var(--accent);
  color:#00131D;
  border:0;
  border-radius:10px;
  padding:10px 16px;
  margin-top:10px;
  cursor:pointer;
  font-weight:600;
}

/* 저장 목록 */
.saved-item{
  display:flex;
  justify-content:space-between;
  margin:6px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
  padding-bottom:6px;
  font-size:15px;
}
.btnX{
  background:transparent;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  border-radius:6px;
  padding:1px 6px;
  cursor:pointer;
}

/* NAV BOTTOM */
.nav{
  position:fixed; bottom:0; left:0; right:0;
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(10px);
  display:flex;
  justify-content:space-around;
  padding:12px 0;
}
.nav-btn{color:var(--muted); font-size:22px; cursor:pointer;}
.nav-btn.active{color:var(--accent);}
</style>
</head>

<body>

<!-- 📌 HOME -->
<section id="home" class="page active">
  <div class="home-title">✝️ 오늘의 말씀</div>
  <div class="home-sub">(주님과 함께 오늘도)</div>

  <div id="usage-box">📖 오늘의 말씀 사용법 ▽</div>
  <div id="usage-content">
    1) '오늘의 말씀' 버튼을 눌러 하루의 말씀을 확인하세요.<br>
    2) 마음에 와닿는 말씀은 '저장하기' 버튼으로 보관합니다.<br>
    3) 저장된 말씀은 '저장함'에서 언제든 볼 수 있습니다.<br>
    4) 말씀을 친구와 공유하여 축복을 나누세요. 🕊
  </div>

  <div class="menu">
    <div class="pill" onclick="go('today')">📖 오늘의 말씀</div>
    <div class="pill" onclick="go('saved')">⭐ 말씀 저장함</div>
    <div class="pill" onclick="go('share')">🕊 말씀 공유하기</div>
  </div>
</section>

<!-- 📌 오늘의 말씀 -->
<section id="today" class="page">
  <div class="card">
    <div id="verse">로딩 중...</div>
    <div id="ref" style="opacity:.7;margin-top:6px;">-</div>
    <img id="img" />
    <button class="btn" onclick="loadVerse()">🔄 다른 말씀 보기</button>
    <button class="btn" onclick="saveVerse()">⭐ 저장하기</button>
  </div>
</section>

<!-- 📌 저장함 -->
<section id="saved" class="page">
  <div class="card">
    <b>저장된 말씀</b>
    <div id="savedList" style="margin-top:10px;"></div>
  </div>
</section>

<!-- 📌 공유 -->
<section id="share" class="page">
  <div class="card">
    <b>공유 링크</b>
    <input id="shareLink" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;background:#ffffff20;color:white;border:1px solid #ffffff40;" readonly />
    <button class="btn" onclick="copyShare()">📋 복사</button>
  </div>
</section>

<!-- NAV -->
<div class="nav">
  <div class="nav-btn active" onclick="go('home')">🏠</div>
  <div class="nav-btn" onclick="go('today')">📖</div>
  <div class="nav-btn" onclick="go('saved')">⭐</div>
  <div class="nav-btn" onclick="go('share')">🕊</div>
</div>

<script>
// ✅ API URL 수정
const API_URL = "https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";

const $=id=>document.getElementById(id);

// NAV
function go(p){
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  $(p).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');
}

// 사용법 토글
$("usage-box").onclick = ()=>{
  $("usage-content").style.display = $("usage-content").style.display==="block"?"none":"block";
};

// 말씀 불러오기
async function loadVerse(){
  let res = await fetch(API_URL);
  let data = await res.json();
  $("verse").textContent = data.Verse;
  $("ref").textContent = data.Reference;
  if(data.ImageURL){
    $("img").src = data.ImageURL;
    $("img").style.display="block";
  } else $("img").style.display="none";
  $("shareLink").value = location.origin + location.pathname + "?id=" + data.ID;
}
loadVerse();

// 저장
function saveVerse(){
  let list = JSON.parse(localStorage.getItem("saved")||"[]");
  list.unshift({v:$("verse").textContent, r:$("ref").textContent});
  localStorage.setItem("saved", JSON.stringify(list.slice(0,200)));
  renderSaved();
}
function renderSaved(){
  let list = JSON.parse(localStorage.getItem("saved")||"[]");
  $("savedList").innerHTML = list.map((x,i)=>`
    <div class="saved-item">
      <span>${x.v} (${x.r})</span>
      <button class="btnX" onclick="del(${i})">X</button>
    </div>`).join("");
}
function del(i){
  let list = JSON.parse(localStorage.getItem("saved")||"[]");
  list.splice(i,1);
  localStorage.setItem("saved",JSON.stringify(list));
  renderSaved();
}
renderSaved();

// 공유
async function copyShare(){
  await navigator.clipboard.writeText($("shareLink").value);
  alert("복사되었습니다.")
}
</script>
</body>
</html>
