<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlessVerse</title>
    <style>
        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(to bottom, #ffd6e8, #d6eaff, #ffd6e8);
            display: flex;
            flex-direction: column;
            height: 100vh;
            text-align: center;
        }

        h1 { margin-top: 25px; font-size: 26px; }

        .card {
            background: white;
            padding: 25px;
            margin: 40px auto;
            width: 85%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .verse-img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 12px;
            display: none;
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            font-size: 15px;
        }

        #randomBtn { background: #ff8ca7; color: white; }
        #shareBtn { background: transparent; color: black; margin-top: auto; margin-bottom: 15px; }
    </style>
</head>
<body>

<h1>BlessVerse</h1>

<div class="card">
    <img id="verseImage" class="verse-img">
    <p id="verseText"></p>
    <p id="verseRef" style="color: #666; font-size: 14px;"></p>
    <button id="randomBtn">랜덤 말씀 보기</button>
</div>

<button id="shareBtn">공유</button>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";
let bibleData = [];

fetch(scriptURL)
  .then(response => response.json())
  .then(data => {
    bibleData = data;
    showRandom();
  });

function showRandom() {
  if (bibleData.length === 0) return;

  const random = bibleData[Math.floor(Math.random() * bibleData.length)];

  document.getElementById("verseText").textContent = random.Verse;
  document.getElementById("verseRef").textContent = random.Reference;

  const img = document.getElementById("verseImage");
  if (random.ImageURL && random.ImageURL.trim() !== "") {
      img.src = random.ImageURL;
      img.style.display = "block";
  } else {
      img.style.display = "none";
  }
}

document.getElementById("randomBtn").onclick = showRandom;

document.getElementById("shareBtn").onclick = async () => {
  if (navigator.share) {
    navigator.share({
      title: "BlessVerse",
      text: "말씀 나눔 💖",
      url: window.location.href
    });
  } else {
    alert("공유 기능을 지원하지 않는 기기입니다.");
  }
};
</script>

</body>
</html>
