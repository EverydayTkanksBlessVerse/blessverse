<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 말씀</title>
<style>
body {
  font-family: 'Pretendard', sans-serif;
  margin: 0;
  background: linear-gradient(#ffdde9, #d0e8ff);
  text-align: center;
}
.container {
  margin-top: 50px;
  display: inline-block;
  padding: 30px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  width: 320px;
}
img {
  width: 100%;
  border-radius: 10px;
  margin-bottom: 15px;
}
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
}
#randomBtn { background: #ff8da1; color: white; }
#saveBtn { background: white; border: 1px solid #aaa; }
.footer {
  margin-top: 35px;
  font-size: 13px;
  color: #666;
}
</style>
</head>
<body>

<h1>오늘의 말씀</h1>

<div class="container">
  <img id="verseImage" src="" alt="말씀 이미지" style="display:none;">
  <div id="verseText">로딩 중...</div>
  <div id="verseRef" style="margin:10px 0; color:#666;"></div>
  <div id="verseMeditation" style="margin-bottom: 10px; font-weight:600; color:#444;"></div>

  <button id="randomBtn">랜덤 말씀 보기</button>
  <button id="saveBtn">내 말씀 저장</button>
</div>

<div class="footer">
  © BlessVerse
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";

async function loadRandom() {
  const res = await fetch(API_URL);
  const json = await res.json();

  const data = json.verse;

  document.getElementById("verseText").innerText = data.Verse;
  document.getElementById("verseRef").innerText = data.Reference;
  document.getElementById("verseMeditation").innerText = data.Meditation;

  if (data.ImageURL && data.ImageURL.trim() !== "") {
    const img = document.getElementById("verseImage");
    img.src = data.ImageURL;
    img.style.display = "block";
  }
}

document.getElementById("randomBtn").addEventListener("click", loadRandom);
document.getElementById("saveBtn").addEventListener("click", () => alert("저장 기능 곧 추가됩니다 😄"));

loadRandom();
</script>

</body>
</html>
