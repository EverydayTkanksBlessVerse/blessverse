<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>BlessVerse</title>
<style>
body {
  margin:0; font-family:'Pretendard', sans-serif; text-align:center;
  background: linear-gradient(to bottom, #ffd5e7, #cfe7ff, #ffd5e7);
}
.card {
  width: 330px; margin: 80px auto; padding: 30px;
  background:white; border-radius:16px; box-shadow:0 4px 15px rgba(0,0,0,0.1);
}
img { width:100%; border-radius:12px; margin-bottom:20px; display:none; }
button {
  width:80%; padding:12px; border:none; border-radius:8px;
  font-size:15px; cursor:pointer; margin-top:10px;
}
#randomBtn { background:#ff7a9e; color:white; }
#saveBtn { background:white; border:1px solid #ccc; }
.bottom-bar {
  position:fixed; bottom:0; left:0; width:100%;
  display:flex; justify-content:space-between; padding:15px 40px;
  font-size:14px; background:white;
}
a { text-decoration:none; color:black; }
</style>
</head>
<body>

<h1>BlessVerse</h1>

<div class="card">
  <img id="verseImage">
  <div id="verseText"></div>
  <div style="margin-top:8px; color:#666;" id="verseRef"></div>
  <div style="margin-top:8px; font-weight:600;" id="verseMeditation"></div>

  <button id="randomBtn">랜덤 말씀 보기</button>
  <button id="saveBtn">내 말씀 저장</button>
</div>

<div class="bottom-bar">
  <a href="saved.html">저장함</a>
  <a id="shareBtn">공유</a>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";

// 요소 연결
const verseImage = document.getElementById("verseImage");
const verseText = document.getElementById("verseText");
const verseRef = document.getElementById("verseRef");
const verseMeditation = document.getElementById("verseMeditation");
const randomBtn = document.getElementById("randomBtn");
const saveBtn = document.getElementById("saveBtn");
const shareBtn = document.getElementById("shareBtn");

let currentVerse = null;

// 말씀 표시 함수
function displayVerse(v){
  currentVerse = v;
  verseText.textContent = v.Verse;
  verseRef.textContent = v.Reference;
  verseMeditation.textContent = v.Meditation || "";

  if(v.ImageURL){
    verseImage.src = v.ImageURL;
    verseImage.style.display = "block";
  } else verseImage.style.display = "none";
}

// 랜덤 말씀 불러오기
async function getRandom(){
  const r = await fetch(API);
  const j = await r.json();
  displayVerse(j.verse);
}
randomBtn.onclick = getRandom;

// 저장
saveBtn.onclick = () => {
  let saved = JSON.parse(localStorage.getItem("savedVerses") || "[]");
  saved.push(currentVerse);
  localStorage.setItem("savedVerses", JSON.stringify(saved));
  alert("저장되었습니다 ✅");
};

// 공유 기능
shareBtn.onclick = async () => {
  let text = `${currentVerse.Verse}\n(${currentVerse.Reference})`;
  if(navigator.share){
    navigator.share({ title:"BlessVerse", text })
  } else {
    navigator.clipboard.writeText(text);
    alert("🔗 말씀이 클립보드에 복사되었습니다!");
  }
};
</script>

</body>
</html>
