<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>저장된 말씀</title>
<style>
body { margin:0; font-family:'Pretendard', sans-serif; text-align:center; background:#fafafa; }
.item { background:white; margin:15px auto; padding:20px; width:330px; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.07); }
button { margin-top:8px; padding:8px 14px; border:none; border-radius:6px; cursor:pointer; }
.del { background:#ddd; }
.share { background:#ffc1d6; }
</style>
</head>
<body>

<h2>저장한 말씀</h2>
<div id="list"></div>

<a href="index.html" style="display:block;margin:30px;">← 돌아가기</a>

<script>
function loadSaved(){
  let saved = JSON.parse(localStorage.getItem("savedVerses") || "[]");
  let list = document.getElementById("list");
  list.innerHTML = "";

  saved.forEach((v,i)=>{
    let div = document.createElement("div");
    div.className="item";
    div.innerHTML = `
      <div>${v.Verse}</div>
      <div style="color:#666;margin:5px 0;">${v.Reference}</div>
      <div style="font-weight:600;">${v.Meditation||""}</div>
      <button class="share">공유</button>
      <button class="del">삭제</button>
    `;

    div.querySelector(".share").onclick = ()=>{
      let text = `${v.Verse}\n(${v.Reference})`;
      if(navigator.share) navigator.share({ title:"BlessVerse", text });
      else { navigator.clipboard.writeText(text); alert("복사됨 ✅"); }
    };

    div.querySelector(".del").onclick = ()=>{
      saved.splice(i,1);
      localStorage.setItem("savedVerses", JSON.stringify(saved));
      loadSaved();
    };

    list.appendChild(div);
  });
}
loadSaved();
</script>

</body>
</html>
