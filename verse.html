<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>오늘의 말씀</title>
  <style>
    :root{
      --pink:#ffc2d4;
      --blue:#d6e6ff;
      --primary:#ff8faa;
      --ink:#111;
      --muted:#666;
      --card-bg:#fff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Pretendard, Apple SD Gothic Neo, Noto Sans KR, "Malgun Gothic", sans-serif;
      background: linear-gradient(to bottom,var(--pink),var(--blue));
      min-height:100vh;
      color:var(--ink);
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    h1{margin:24px 0 6px; font-size:28px; font-weight:800;}
    .date{font-size:13px;color:var(--muted); margin-bottom:16px;}

    .card{
      width:min(92vw,640px);
      background:var(--card-bg);
      border-radius:16px;
      box-shadow:0 8px 28px rgba(0,0,0,.12);
      padding:22px 22px 16px;
      margin:14px auto 20px;
      text-align:center;
    }

    .verse{
      white-space:pre-wrap;
      line-height:1.65;
      font-size:18px;
      font-weight:600;
    }
    .ref{margin-top:8px; font-size:14px; color:#444; font-weight:700;}
    .tag{margin-top:4px; font-size:12px; color:#888;}

    .actions{display:flex; gap:8px; justify-content:center; margin:14px 0 10px;}
    button{
      border:none; outline:none; cursor:pointer;
      padding:12px 16px; border-radius:10px; font-weight:700;
      background:var(--primary); color:#fff; min-width:140px;
      box-shadow:0 6px 16px rgba(255,143,170,.35);
    }
    .light{background:#fff;color:#111;border:1px solid #eee; box-shadow:none}

    .dock{
      position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
      display:flex; gap:10px; background:rgba(255,255,255,.9);
      border-radius:18px; padding:8px 12px; box-shadow:0 8px 18px rgba(0,0,0,.15);
    }
    .dock button{min-width:90px; padding:10px 14px; border-radius:12px}

    .modal{
      position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.35);
      padding:20px;
    }
    .modal.on{display:grid}
    .sheet{
      width:min(92vw,680px); max-height:80vh; overflow:auto;
      background:#fff; border-radius:14px; padding:18px;
      box-shadow:0 12px 30px rgba(0,0,0,.25);
      text-align:left;
    }
    .item{border:1px solid #eee; border-radius:10px; padding:12px; margin:10px 0;}
  </style>
</head>
<body>

<!-- ✅ 홈으로 버튼 수정 -->
<button onclick="location.href='index.html'" 
style="position:fixed; top:16px; left:16px; padding:8px 16px;
border-radius:8px; background:white; border:none; cursor:pointer; font-weight:600;">
← 홈으로
</button>

<h1>오늘의 말씀</h1>
<div class="date" id="todayStr"></div>

<div class="card">
  <div class="verse" id="verseText">버튼을 눌러 말씀을 불러오세요.</div>
  <div class="ref" id="reference"></div>
  <div class="tag" id="tag"></div>

  <div class="actions">
    <button id="randomBtn">랜덤 말씀 보기</button>
    <button class="light" id="saveBtn">저장하기</button>
  </div>
</div>

<div class="dock">
  <button class="light" id="todayBtn">오늘</button>
  <button class="light" id="savedBtn">저장함</button>
</div>

<!-- ✅ 저장함 only -->
<div class="modal" id="modal">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <h3>저장한 말씀</h3>
      <button class="light" id="closeModal">닫기</button>
    </div>
    <div id="savedList"></div>
  </div>
</div>

<script>
// ✅ 기능 유지 + 공유 삭제버전 그대로 적용
const BASE_URL = "YOUR_GAS_URL";

const verseText = document.getElementById("verseText");
const reference = document.getElementById("reference");
const tag = document.getElementById("tag");

async function showToday(){
  const r = await fetch(BASE_URL);
  const j = await r.json();
  verseText.textContent = j.verse.Verse;
  reference.textContent = j.verse.Reference;
  tag.textContent = j.verse.Tag ? "#" + j.verse.Tag : "";
}
document.getElementById("todayBtn").onclick = showToday;

document.getElementById("randomBtn").onclick = showToday;

document.getElementById("saveBtn").onclick = ()=>{
  const item = {v:verseText.textContent,r:reference.textContent,t:tag.textContent};
  const list = JSON.parse(localStorage.getItem("saved")||"[]");
  list.unshift(item);
  localStorage.setItem("saved",JSON.stringify(list));
  alert("저장되었습니다.");
};

document.getElementById("savedBtn").onclick = ()=>{
  const list = JSON.parse(localStorage.getItem("saved")||"[]");
  const box = document.getElementById("savedList");
  box.innerHTML = list.map(x=>`
    <div class="item">
      <div style="font-weight:600;">${x.v}</div>
      <div style="margin-top:6px; font-size:14px; color:#555;">${x.r} ${x.t}</div>
    </div>
  `).join("");
  document.getElementById("modal").classList.add("on");
};

document.getElementById("closeModal").onclick = ()=>{
  document.getElementById("modal").classList.remove("on");
};

showToday();
</script>
</body>
</html>
