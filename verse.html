<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 말씀</title>

<style>
:root{
  --pink:#ffc2d4;
  --blue:#d6e6ff;
  --primary:#ff8faa;
  --ink:#111;
  --muted:#666;
  --card-bg:#fff;
}
body{
  margin:0; font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
  background:linear-gradient(to bottom,var(--pink),var(--blue));
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
}
h1{margin:40px 0 6px; font-size:28px; font-weight:800;}
.date{font-size:13px;color:var(--muted); margin-bottom:14px;}

.card{
  width:min(92vw,640px); background:var(--card-bg); border-radius:16px; box-shadow:0 8px 28px rgba(0,0,0,.12);
  padding:22px; text-align:center; margin-bottom:30px;
}

#imgwrap {width:100%; border-radius:12px; overflow:hidden; display:none; margin-bottom:12px;}
#imgwrap img {width:100%; display:block;}

.verse{white-space:pre-wrap; line-height:1.65; font-size:18px; font-weight:600;}
.ref{margin-top:8px; font-size:14px; font-weight:700; color:#444;}
.tag{margin-top:4px; font-size:12px; color:#777;}

.actions{display:flex; justify-content:center; gap:10px; margin-top:16px;}
button{padding:12px 16px; border-radius:10px; border:none; font-weight:700; cursor:pointer;}
.primary{background:var(--primary); color:white;}
.light{background:white; border:1px solid #ddd;}

.dock{
  position:fixed; bottom:12px; left:50%; transform:translateX(-50%);
  display:flex; gap:8px; background:white; padding:8px 14px;
  border-radius:16px; box-shadow:0 6px 18px rgba(0,0,0,.18);
}
.dock button{min-width:90px;}

.modal{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; place-items:center;}
.modal.on{display:grid;}
.sheet{
  width:min(92vw,680px); max-height:80vh; overflow:auto;
  background:white; padding:18px; border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.25);
}
.item{border:1px solid #eee; border-radius:10px; padding:12px; margin-top:10px;}
</style>
</head>

<body>

<button onclick="location.href='index.html'" style="position:fixed; top:16px; left:16px; padding:8px 14px; background:white; border:none; border-radius:8px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.15);">
← 홈으로
</button>

<h1>오늘의 말씀</h1>
<div class="date" id="todayStr"></div>

<div class="card">
  <div id="imgwrap"><img id="img"></div>
  <div class="verse" id="verseText">버튼을 눌러 말씀을 불러오세요.</div>
  <div class="ref" id="reference"></div>
  <div class="tag" id="tag"></div>

  <div class="actions">
    <button class="primary" id="randomBtn">랜덤</button>
    <button class="light" id="saveBtn">저장하기</button>
  </div>
</div>

<div class="dock">
  <button class="light" id="todayBtn">오늘</button>
  <button class="light" id="savedBtn">저장함</button>
  <button class="primary" id="shareBtn">공유</button>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <h3>저장한 말씀</h3>
    <div id="savedList"></div>
    <button class="light" style="margin-top:10px;" onclick="modal.classList.remove('on')">닫기</button>
  </div>
</div>

<script>
const BASE_URL="https://script.google.com/macros/s/AKfycbziPgmZTutWnA_L1KUTfNrFdbFJnqTRBxbawMsKrOiaOjYuBa0do6D3gMOjFtjz1r_ZhA/exec";
const verseText=document.getElementById("verseText"),reference=document.getElementById("reference"),tag=document.getElementById("tag"),imgwrap=document.getElementById("imgwrap"),img=document.getElementById("img");

async function load(){
 const r=await fetch(BASE_URL); const j=await r.json();
 verseText.textContent=j.verse.Verse; reference.textContent=j.verse.Reference;
 tag.textContent=j.verse.Tag?"#"+j.verse.Tag:"";
 if(j.verse.ImageURL){img.src=j.verse.ImageURL; imgwrap.style.display="block";} else imgwrap.style.display="none";
}
document.getElementById("todayBtn").onclick=load;
document.getElementById("randomBtn").onclick=load;

document.getElementById("saveBtn").onclick=()=>{
 const x={v:verseText.textContent,r:reference.textContent,t:tag.textContent};
 const list=JSON.parse(localStorage.getItem("saved")||"[]"); list.unshift(x);
 localStorage.setItem("saved",JSON.stringify(list)); alert("저장되었습니다.");
}

const modal=document.getElementById("modal");
document.getElementById("savedBtn").onclick=()=>{
 const list=JSON.parse(localStorage.getItem("saved")||"[]");
 savedList.innerHTML=list.map(x=>`<div class="item">${x.v}<div style="font-size:14px;color:#666;margin-top:6px;">${x.r} ${x.t}</div></div>`).join("");
 modal.classList.add("on");
}

document.getElementById("shareBtn").onclick=()=>{
 const text=`${verseText.textContent}\n- ${reference.textContent}`;
 navigator.share ? navigator.share({text}) : navigator.clipboard.writeText(text).then(()=>alert("복사 완료"));
}

if(location.hash==="#saved") document.getElementById("savedBtn").click();
load();
</script>

</body>
</html>
